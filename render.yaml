# Render Blueprint (infrastructure as code): één gratis web service met de API én de
# website (web/, geserveerd door FastAPI). Op render.com: New → Blueprint → deze repo.
# Render bouwt api/Dockerfile en deployt opnieuw bij elke push naar main.
# Het Streamlit-dashboard (app/) draait alleen lokaal, voor de analyse op de volledige database.
#
# Gratis plan: 512 MB RAM per dienst, slaapt na 15 minuten zonder bezoek (eerste bezoek
# daarna ~1 minuut wachten). Geheugengebruik API in tests: ~150 MB.
services:
  - type: web
    name: ov-vertraging-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NS_API_KEY
        sync: false          # vul je zelf in op Render (komt nooit in git)
