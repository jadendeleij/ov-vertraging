<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OV-vertragingsvoorspeller — komt je trein op tijd?</title>
  <meta name="description" content="Voorspel de kans dat je trein met vijf minuten of meer vertraging vertrekt, op basis van een jaar Nederlandse treindata en de KNMI-weersverwachting.">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%232a6fd0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Thema vóór het tekenen zetten, zodat er geen flits van het verkeerde thema is.
    try {
      const t = localStorage.getItem("thema");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) { /* geen opslag beschikbaar: systeeminstelling volgen */ }
  </script>
</head>
<body>
  <a class="skip" href="#app">Naar de inhoud</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/" aria-label="OV-vertragingsvoorspeller, naar Voorspel">
        <span class="brand__dot" aria-hidden="true"></span>
        <span class="brand__name">OV-vertragingsvoorspeller</span>
      </a>
      <nav class="nav" aria-label="Hoofdnavigatie">
        <a href="#/" data-route="voorspel">Voorspel</a>
        <a href="#/vertrekbord" data-route="vertrekbord">Vertrekbord</a>
        <a href="#/inzichten" data-route="inzichten">Inzichten</a>
        <a href="#/over" data-route="over">Over</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Wissel tussen licht en donker thema">
        <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <main id="app" class="page" tabindex="-1" aria-live="polite"></main>

  <footer class="footer">
    <p>
      Treindata: <a href="https://www.rijdendetreinen.nl/open-data" rel="noopener">Rijden de Treinen</a>
      (<a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener">CC BY 4.0</a>) ·
      Weer: <a href="https://www.knmi.nl" rel="noopener">KNMI</a> via <a href="https://open-meteo.com" rel="noopener">Open-Meteo</a> ·
      Live vertrektijden: NS. Geen officiële dienst van NS of ProRail.
    </p>
    <p class="footer__meta">
      <a href="https://github.com/jadendeleij/ov-vertraging" rel="noopener">Broncode op GitHub</a> ·
      <a href="/docs">API-documentatie</a> ·
      <span id="model-version">model —</span>
    </p>
  </footer>

  <nav class="tabbar" aria-label="Navigatie">
    <a href="#/" data-route="voorspel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Voorspel
    </a>
    <a href="#/vertrekbord" data-route="vertrekbord">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16M4 14.5h16"/></svg>Bord
    </a>
    <a href="#/inzichten" data-route="inzichten">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>Inzichten

    <a href="#/over" data-route="over">

  </nav>

  <datalist id="stations"></datalist>
  <script src="app.js" defer></script>

</html>
