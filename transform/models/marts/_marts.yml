version: 2

models:
  - name: fct_departures
    description: >
      Eén rij per treinvertrek met target is_delayed_5min (NULL bij annulering of
      onbekende vertraging), tijd, traject en weer. Kolommen over dezelfde rit
      (arrival_delay_min, annuleringsvlaggen) zijn alleen voor analyse, niet als feature.
    columns:
      - name: departure_id
        description: Sleutel = stop_id uit het treinarchief.
        data_tests: [unique, not_null]
      - name: station_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_code
      - name: route_code
        data_tests: [not_null]
      - name: next_station_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_code
      - name: departure_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: service_type
        description: Alleen echte treinen (geen vervangend vervoer).
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Intercity
                  - Intercity direct
                  - Sprinter
                  - Stoptrein
                  - Sneltrein
                  - ICE
                  - EuroCity
                  - Eurocity Direct
                  - Eurostar
                  - European Sleeper
                  - Nightjet
                  - Nachttrein
                  - Int. Trein
                  - GoVolta
                  - Speciale Trein
      - name: is_cancelled
        data_tests: [not_null]
      - name: is_delayed_5min
        description: Target. true = vertrokken met >= 5 min vertraging; NULL = geannuleerd of onbekend.
      - name: departure_delay_min
        data_tests:
          - value_between:
              arguments: {min_value: -5, max_value: 600}

  - name: dim_station
    description: >
      Alle stations uit het stationsbestand plus stations uit het treinarchief die er
      niet in staan (in_station_file = false, zonder coördinaten), met gekoppelde weerstations.
    columns:
      - name: station_code
        data_tests: [unique, not_null]

  - name: dim_date
    description: Eén rij per dag met weekdag, seizoen, feestdagen en schoolvakanties per regio.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: n_regions_school_holiday
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 3}

  - name: agg_route_hour
    description: >
      Punctualiteit per traject x uur x weekdag over de hele periode. Bevat toekomst-
      informatie t.o.v. een individueel vertrek: niet als modelfeature gebruiken.
    data_tests:
      - unique_combination:
          arguments:
            columns: [route_code, departure_hour, departure_weekday]
    columns:
      - name: pct_delayed_5min
        data_tests:
          - value_between:
              arguments: {min_value: 0, max_value: 1}
