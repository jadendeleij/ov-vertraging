name: ov_vertraging
version: "0.1.0"
config-version: 2
profile: ov_vertraging

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  local_tz: "Europe/Amsterdam"
  # Verder dan dit van een KNMI-station: weer is niet representatief -> NULL.
  weather_max_distance_km: 50

models:
  ov_vertraging:
    # staging: één-op-één met de bron, opgeschoond. Views: goedkoop, altijd actueel.
    staging:
      +schema: staging
      +materialized: view
    # intermediate: koppelingen en tussenstappen.
    intermediate:
      +schema: intermediate
      +materialized: table
    # marts: wat dashboard en model gebruiken.
    marts:
      +schema: marts
      +materialized: table

# Kleine vaste tabellen uit CSV (gemaakt met python -m ov_vertraging.calendar_seeds).
seeds:
  ov_vertraging:
    +schema: seeds
    nl_public_holidays:
      +column_types: {holiday_date: date, holiday_name: varchar}
    nl_school_holidays:
      +column_types:
        {schoolyear: varchar, vacation_name: varchar, region: varchar,
         start_date: date, end_date: date}
