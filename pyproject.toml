[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ov-vertraging"
version = "0.1.0"
description = "Voorspel de kans op ≥ 5 minuten vertraging van Nederlandse treinen op basis van historische treindata en weer."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
# Basis: wat overal nodig is. De rest per onderdeel, zodat de Docker-images slank blijven
# (de API hoeft geen dbt, Dagster of MLflow mee te slepen).
dependencies = [
    "duckdb>=1.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
# live API (fase 5)
api = [
    "lightgbm>=4.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
# Streamlit-dashboard (fase 3 + 5)
app = [
    "streamlit>=1.40",
    "plotly>=5.24",
]
# datapipeline: dbt + Dagster (fase 2)
pipeline = [
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.10,<2",
    "dagster>=1.9",
    "dagster-dbt>=0.25",
    "dagster-webserver>=1.9",
]
# model trainen en evalueren (fase 4)
model = [
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "mlflow>=2.16",
    "matplotlib>=3.9",
]
# ontwikkelen: alles, plus tests, lint en notebooks
dev = [
    "ov-vertraging[api,app,pipeline,model]",
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "jupyter>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# zodat tests `orchestration.definitions` kunnen importeren
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
