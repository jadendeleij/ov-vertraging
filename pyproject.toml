[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ov-vertraging"
version = "0.1.0"
description = "Voorspel de kans op ≥ 5 minuten vertraging van Nederlandse treinen op basis van historische treindata en weer."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.10,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
